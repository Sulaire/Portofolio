<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orvalle — Mapa de Relaciones</title>
<style>
/* No external anything. The map has to survive being emailed, opened from a
   USB stick and screenshotted on a train, so it carries no CDN, no font
   request and no fetch(): the data is inlined below and file:// works. */
:root{
  --bg:#14110D; --bg2:#1B1712; --bg3:#221D17;
  --bone:#E8DFC8; --dim:#A89B82; --faint:#6C6252;
  --ember:#C9673A; --gold:#C9973A;
  --hair:rgba(232,223,200,.11); --hair2:rgba(232,223,200,.2);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--bone);font:14px/1.5 var(--sans);
  overflow:hidden;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
.app{display:flex;flex-direction:column;height:100dvh}

/* ── header ───────────────────────────────────────────────── */
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:11px 18px;background:var(--bg2);border-bottom:1px solid var(--hair);flex-shrink:0}
h1{font:600 18px/1 var(--serif);letter-spacing:.01em}
.sub{font:11px/1 var(--mono);color:var(--ember);text-transform:uppercase;letter-spacing:.09em}
#counts{margin-left:auto;font:11px/1.4 var(--mono);color:var(--dim)}

/* ── control bar ──────────────────────────────────────────── */
/* Every group wraps. The old bar put five sliders and five buttons in one
   flex item with no wrap inside a body with overflow:hidden, so below about
   1100px the last controls were clipped off the edge and unreachable. */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px 14px;
  padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--hair);flex-shrink:0}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.lab{font:10px/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);white-space:nowrap}
.seg{display:flex;border:1px solid var(--hair2);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;border-right:1px solid var(--hair2);color:var(--dim);
  font:11px/1 var(--mono);padding:6px 9px;cursor:pointer;transition:.13s}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--bone);background:rgba(255,255,255,.05)}
.seg button[aria-pressed=true]{background:var(--ember);color:#14110D;font-weight:600}
.btn{background:none;border:1px solid var(--hair2);border-radius:6px;color:var(--dim);
  font:11px/1 var(--mono);padding:6px 10px;cursor:pointer;transition:.13s;white-space:nowrap}
.btn:hover{color:var(--bone);border-color:var(--dim)}
.btn[aria-pressed=true]{background:rgba(201,103,58,.16);border-color:var(--ember);color:var(--ember)}
input[type=range]{-webkit-appearance:none;appearance:none;width:96px;height:3px;
  background:var(--hair2);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
  border-radius:50%;background:var(--ember);cursor:pointer}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;
  background:var(--ember);cursor:pointer}
.val{font:10px/1 var(--mono);color:var(--dim);min-width:74px}

/* search */
.search{position:relative}
#q{background:rgba(0,0,0,.3);border:1px solid var(--hair2);border-radius:6px;color:var(--bone);
  font:12px/1 var(--sans);padding:7px 9px;width:170px;outline:none}
#q::placeholder{color:var(--faint)}
#q:focus{border-color:var(--dim)}
#hits{position:absolute;top:calc(100% + 4px);left:0;z-index:70;min-width:230px;background:#181511;
  border:1px solid var(--hair2);border-radius:6px;max-height:280px;overflow:auto;display:none;
  box-shadow:0 8px 26px rgba(0,0,0,.5)}
#hits.open{display:block}
#hits button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--bone);
  font:12.5px/1.35 var(--sans);padding:7px 10px;cursor:pointer}
#hits button:hover,#hits button.cur{background:rgba(255,255,255,.08)}
#hits small{display:block;font:9.5px/1.4 var(--mono);color:var(--faint);letter-spacing:.04em}

/* chips */
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font:10px/1 var(--mono);padding:5px 9px;border-radius:20px;border:1px solid var(--hair2);
  background:none;color:var(--dim);cursor:pointer;transition:.13s;white-space:nowrap}
.chip:hover{color:var(--bone);border-color:var(--dim)}
.chip[aria-pressed=true]{color:#14110D;border-color:transparent;font-weight:600}
.chip .n{opacity:.6;margin-left:4px}

/* ── body ─────────────────────────────────────────────────── */
.body{display:flex;flex:1;min-height:0;position:relative}
#stage{flex:1;position:relative;min-width:0;overflow:hidden}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.drag{cursor:grabbing}

.edge{fill:none;transition:opacity .16s}
.edge-hit{stroke:transparent;stroke-width:16;fill:none;cursor:pointer}
.elabel{font:9.5px/1 var(--mono);fill:var(--dim);pointer-events:none;
  paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
.node{cursor:pointer}
.node circle{stroke:var(--bg);stroke-width:2}
.nlabel{font:600 11px/1 var(--sans);fill:var(--bone);pointer-events:none;
  paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.nsub{font:8.5px/1 var(--mono);fill:var(--faint);pointer-events:none;
  paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.glabel{font:600 13px/1 var(--serif);fill:var(--dim);pointer-events:none;text-anchor:middle;
  paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.rlabel{font:600 20px/1 var(--serif);fill:rgba(232,223,200,.22);pointer-events:none;
  text-anchor:middle;letter-spacing:.14em;text-transform:uppercase}
.faded{opacity:.07}
.hidden{display:none}
.secret-ring{fill:none;stroke:var(--gold);stroke-width:1.2;stroke-dasharray:2 3;opacity:.9}

/* hover card — the Active Time Lore idea: the article's own lead paragraph,
   which the style guide already promises is two or three sentences saying who
   this is, shown without leaving the map. */
#lore{position:absolute;z-index:60;max-width:310px;background:var(--bg3);
  border:1px solid var(--hair2);border-radius:7px;padding:11px 13px;pointer-events:none;
  opacity:0;transition:opacity .13s;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#lore.on{opacity:1}
#lore h4{font:600 14px/1.25 var(--serif);margin-bottom:2px}
#lore .m{font:9.5px/1.5 var(--mono);color:var(--ember);text-transform:uppercase;letter-spacing:.07em}
#lore p{font:12px/1.5 var(--sans);color:var(--dim);margin-top:7px}
#lore .tag{display:inline-block;font:9px/1 var(--mono);color:var(--gold);
  border:1px solid rgba(201,151,58,.4);border-radius:3px;padding:3px 5px;margin-top:8px}

/* ── sidebar ──────────────────────────────────────────────── */
#side{width:352px;flex-shrink:0;border-left:1px solid var(--hair);background:var(--bg2);
  overflow-y:auto;padding:18px}
#side.off{display:none}
#toggle-side{position:absolute;right:0;top:50%;transform:translateY(-50%);width:17px;height:52px;
  background:var(--bg2);border:1px solid var(--hair);border-right:0;border-radius:5px 0 0 5px;
  color:var(--dim);font:11px/1 var(--mono);cursor:pointer;z-index:6}
.sh{font:10px/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
  margin:20px 0 9px}
.sh:first-child{margin-top:0}
.dname{font:600 21px/1.15 var(--serif);color:#EDE3D0}
.dmeta{font:10.5px/1.6 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.dbrief{font:13px/1.62 var(--sans);color:var(--dim);margin-top:13px;padding:12px 13px;
  background:rgba(232,223,200,.035);border:1px solid var(--hair);border-radius:4px}
.back{background:none;border:1px solid var(--hair2);border-radius:5px;color:var(--dim);
  font:10px/1 var(--mono);padding:6px 9px;cursor:pointer;margin-bottom:14px}
.back:hover{color:var(--bone)}

/* A relationship is two readings. Showing one number was the old panel's
   central lie: it privileged whichever side happened to be `source`. */
.rel{border-bottom:1px solid var(--hair);padding:11px 0;cursor:pointer}
.rel:hover .rn{color:var(--ember)}
.rn{font:600 13.5px/1.3 var(--sans);display:flex;align-items:center;gap:6px}
.dir{display:flex;gap:8px;margin-top:5px;align-items:flex-start}
.arrow{font:10px/1.5 var(--mono);color:var(--faint);flex-shrink:0;width:15px;text-align:center}
.kind{font:11.5px/1.45 var(--sans)}
.note{font:11px/1.5 var(--sans);color:var(--faint);font-style:italic;margin-top:1px}
.undeclared{color:var(--faint);font-style:italic;font-size:11px}
.swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0;margin-top:4px}
.secret{margin-top:6px;padding:8px 10px;border:1px solid rgba(201,151,58,.32);
  border-radius:4px;background:rgba(201,151,58,.06)}
.secret .who{font:9px/1.4 var(--mono);color:var(--gold);text-transform:uppercase;letter-spacing:.07em}
.secret p{font:11.5px/1.5 var(--sans);color:var(--dim);margin-top:4px}
.locked{margin-top:6px;font:10.5px/1.4 var(--mono);color:var(--faint)}
.legend-row{display:flex;align-items:center;gap:9px;font:12px/1.4 var(--sans);color:var(--dim);padding:3px 0}
.legend-line{width:17px;height:3px;border-radius:2px;flex-shrink:0}
.empty{font:13px/1.65 var(--sans);color:var(--dim)}
.empty strong{color:var(--bone)}
.empty kbd{font:10px/1 var(--mono);border:1px solid var(--hair2);border-radius:3px;padding:2px 4px;color:var(--bone)}

#bar-toggle{display:none}
@media(max-width:820px){
  #bar-toggle{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);
    background:var(--bg2);color:var(--dim);font:10px/1 var(--mono);letter-spacing:.09em;
    text-transform:uppercase;padding:9px 16px;cursor:pointer}
  /* Controls off by default on a phone: the map is the point, and a stack of
     filters that leaves it 109px tall is not a map. */
  .bar{display:none}
  .bar.open{display:flex;max-height:52dvh;overflow-y:auto}
}
@media(max-width:900px){
  .body{flex-direction:column}
  #side{width:100%;max-height:44dvh;border-left:0;border-top:1px solid var(--hair)}
  #toggle-side{top:auto;bottom:0;right:50%;transform:translateX(50%);width:52px;height:17px;
    border-radius:5px 5px 0 0;border:1px solid var(--hair);border-bottom:0}
  #q{width:130px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Mapa de Relaciones</h1>
  <span class="sub">Orvalle</span>
  <span id="counts"></span>
</header>

<button id="bar-toggle" aria-expanded="false">Filtros y controles ▾</button>
<div class="bar" id="bar">
  <div class="grp search">
    <input id="q" type="search" placeholder="Buscar personaje…" autocomplete="off" spellcheck="false">
    <div id="hits" role="listbox"></div>
  </div>

  <div class="grp">
    <span class="lab">Saltos</span>
    <div class="seg" id="hops" role="group" aria-label="Radio de saltos">
      <button data-h="0" title="Todo el mapa">Todo</button>
      <button data-h="1" title="Solo su gente">1</button>
      <button data-h="2" title="Su mundo">2</button>
      <button data-h="3" title="Ya es un mapa">3</button>
    </div>
  </div>

  <div class="grp">
    <span class="lab">Revelación</span>
    <input type="range" id="reveal" min="1" max="3" step="1" value="1"
           aria-label="Nivel de revelación">
    <span class="val" id="reveal-val"></span>
  </div>

  <div class="grp">
    <span class="lab">Vínculo</span>
    <div class="seg" id="axis" role="group" aria-label="Eje de las aristas">
      <button data-a="kind">Sentimiento</button>
      <button data-a="bond">Estructura</button>
    </div>
  </div>

  <div class="grp">
    <button class="btn" id="perspective" title="Ver el mapa como lo ve un personaje">Perspectiva</button>
    <button class="btn" id="fit" title="Encuadrar todo">Encuadrar</button>
    <button class="btn" id="reset" title="Volver al estado inicial">Reiniciar</button>
  </div>

  <div class="grp" style="flex-basis:100%">
    <span class="lab">Reino</span><div class="chips" id="realms"></div>
    <span class="lab" style="margin-left:8px">Pueblo</span><div class="chips" id="peoples"></div>
  </div>
</div>

<div class="body">
  <div id="stage">
    <svg id="svg" role="application" aria-label="Grafo de relaciones"></svg>
    <div id="lore" role="tooltip"></div>
    <button id="toggle-side" title="Mostrar u ocultar el panel">›</button>
  </div>
  <aside id="side"></aside>
</div>
</div>

<script id="map-data" type="application/json">/*__DATA__*/</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('map-data').textContent);
const $ = s => document.querySelector(s);

/* ── vocabulary ─────────────────────────────────────────────── */
/*__VOCAB__*/

const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));

/* Adjacency, built once. Every hop query and every highlight reads it, and
   rebuilding it per interaction is what made the old map's slider stutter. */
const adj = {};
DATA.nodes.forEach(n => adj[n.id] = []);
DATA.edges.forEach((e, i) => {
  e.i = i;
  if (adj[e.a] && adj[e.b]) { adj[e.a].push(e); adj[e.b].push(e); }
});
const other = (e, id) => e.a === id ? e.b : e.a;
/* The reading FROM `id` about the other person. Undeclared stays undeclared:
   a relationship is two independent readings and mirroring one onto the other
   invents an opinion the character has not been given. */
const from = (e, id) => e.a === id ? e.aToB : e.bToA;

/* ── state ──────────────────────────────────────────────────── */
const DEF = { sel:null, hops:0, reveal:1, axis:'kind', realm:null, people:null,
              persp:null, side:true };
let S = { ...DEF };

/* ── view transform (hand-rolled: no d3, so the file stays standalone) ── */
let T = { x:0, y:0, k:1 };
const svg = $('#svg');
const NS = 'http://www.w3.org/2000/svg';
const gRoot = document.createElementNS(NS, 'g');
const layers = {};
['realms','edges','hits','elabels','groups','nodes'].forEach(L => {
  layers[L] = document.createElementNS(NS, 'g');
  gRoot.appendChild(layers[L]);
});
svg.appendChild(gRoot);

function applyT(){
  gRoot.setAttribute('transform', `translate(${T.x},${T.y}) scale(${T.k})`);
  updateLOD();
}
function viewport(){ const r = svg.getBoundingClientRect(); return {w:r.width, h:r.height}; }

function fit(ids, ms = 420){
  const list = (ids && ids.length ? ids.map(i => byId[i]) : visibleNodes()).filter(Boolean);
  if (!list.length) return;
  const xs = list.map(n => n.x), ys = list.map(n => n.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const {w, h} = viewport();
  /* Pad in SCREEN pixels, not world units: a fixed world padding shrinks to
     nothing when the selection is one node and swallows the view when it is
     the whole map. Labels need roughly this much room either side. */
  const pad = 110;
  const k = Math.max(.12, Math.min(2.4,
    Math.min((w - pad*2) / Math.max(x1-x0, 1), (h - pad*2) / Math.max(y1-y0, 1))));
  animateTo(w/2 - k*(x0+x1)/2, h/2 - k*(y0+y1)/2, k, ms);
}
let anim = null;
function animateTo(x, y, k, ms){
  if (anim) cancelAnimationFrame(anim);
  const from = {...T}, t0 = performance.now();
  if (ms <= 0){ T = {x,y,k}; applyT(); return; }
  (function step(now){
    const p = Math.min(1, (now - t0) / ms);
    const e = p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2;   // easeInOutCubic
    T = { x: from.x + (x-from.x)*e, y: from.y + (y-from.y)*e, k: from.k + (k-from.k)*e };
    applyT();
    if (p < 1) anim = requestAnimationFrame(step);
  })(t0);
}

svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = Math.max(.12, Math.min(2.4, T.k * Math.exp(-ev.deltaY * .0016)));
  T = { k, x: mx - (mx - T.x) * k / T.k, y: my - (my - T.y) * k / T.k };
  applyT();
}, {passive:false});

let drag = null;
svg.addEventListener('pointerdown', ev => {
  if (ev.button !== 0) return;
  drag = { x: ev.clientX, y: ev.clientY, tx: T.x, ty: T.y, moved:false };
  svg.setPointerCapture(ev.pointerId); svg.classList.add('drag');
});
svg.addEventListener('pointermove', ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  T.x = drag.tx + dx; T.y = drag.ty + dy; applyT();
});
const endDrag = ev => {
  if (drag && !drag.moved && ev.target === svg) select(null);
  drag = null; svg.classList.remove('drag');
};
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', () => { drag = null; svg.classList.remove('drag'); });

/* ── what is on screen ──────────────────────────────────────── */
/* Filters compose as AND across facets. Scope filters (realm, people) REMOVE;
   selection and hops DIM. Two different verbs, because dimming a scope filter
   to 7% leaves the same tangle at low alpha and hiding a selection destroys
   the context you selected it for. */
function passesFacets(n){
  return (!S.realm  || n.realm === S.realm)
      && (!S.people || n.people === S.people);
}

/* Perspective. The scope is deliberately narrow, because it is exactly what
   the data supports: a character knows the relationships they are party to,
   plus any secret whose `Known to:` list names them. The wiki does not record
   what Vareth believes about other people's marriages, so the map does not
   pretend to. Anything wider would be invention dressed as a feature. */
function knows(viewerId, e){
  if (e.a === viewerId || e.b === viewerId) return true;
  const name = byId[viewerId].name.toLowerCase();
  return [e.aToB, e.bToA].some(d =>
    d && d.secret && d.secret.knowers.toLowerCase().includes(name));
}
function secretVisible(d){
  if (!d || !d.secret) return false;
  if (S.reveal < 3) return false;
  if (!S.persp) return true;
  const name = byId[S.persp].name.toLowerCase();
  return d.secret.knowers.toLowerCase().includes(name);
}
function hopSet(){
  if (!S.sel || !S.hops) return null;
  const seen = new Map([[S.sel, 0]]);
  let front = [S.sel];
  for (let d = 1; d <= S.hops; d++){
    const next = [];
    for (const id of front)
      for (const e of adj[id]){
        if (!edgeVisible(e)) continue;
        const o = other(e, id);
        if (!seen.has(o)){ seen.set(o, d); next.push(o); }
      }
    front = next;
  }
  return seen;
}
function edgeVisible(e){
  return passesFacets(byId[e.a]) && passesFacets(byId[e.b])
      && e.reveal <= S.reveal
      && (!S.persp || knows(S.persp, e));
}
function visibleNodes(){
  const hop = hopSet();
  return DATA.nodes.filter(n => nodeVisible(n, hop));
}
function nodeVisible(n, hop){
  if (!passesFacets(n) || n.reveal > S.reveal) return false;
  if (hop && !hop.has(n.id)) return false;
  // In perspective mode a character you have no line to is not on your map.
  if (S.persp && n.id !== S.persp && !adj[n.id].some(e => edgeVisible(e)))
    return false;
  return true;
}

/* ── level of detail ────────────────────────────────────────── */
/* The one mechanism that makes a big graph readable: zoomed out you read
   regions and houses, zoomed in you read people. Nothing is "too small to
   see" — it is aggregated into the thing it belongs to, and the `up:` tree
   already says what that thing is. */
function lod(){ return T.k < .38 ? 'realm' : T.k < .72 ? 'group' : 'node'; }
let lastLOD = null;
function updateLOD(){
  const L = lod();
  if (L === lastLOD) return;
  lastLOD = L;
  layers.realms.style.display = L === 'realm' ? '' : 'none';
  layers.groups.style.display = L === 'group' ? '' : 'none';
  layers.nodes.style.display  = L === 'realm' ? 'none' : '';
  document.querySelectorAll('.nlabel,.nsub').forEach(el => {
    el.style.display = L === 'node' ? '' : 'none';
  });
  // Nodes shrink with zoom so a zoomed-out cluster reads as a mass, not
  // as 25 overlapping discs.
  document.querySelectorAll('.node circle.core').forEach(c => {
    c.setAttribute('r', L === 'node' ? c.dataset.r : Math.max(3, c.dataset.r * .55));
  });
  refreshEdges();
}

/* ── draw ───────────────────────────────────────────────────── */
const els = { nodes:{}, edges:[], elabels:[], hits:[] };

function edgeColour(e, dir){
  if (S.axis === 'bond'){
    const fam = BOND_FAMILY[e.bond];
    return fam ? BOND_COLOUR[fam] : 'rgba(232,223,200,.09)';
  }
  const d = dir || e.aToB || e.bToA;
  return FACET_COLOUR[KIND_TO_FACET[d && d.kind] || 'unknown'];
}

function build(){
  // realm plates (far zoom)
  Object.entries(DATA.realms).forEach(([name, r]) => {
    if (name === '—') return;
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'rlabel');
    t.setAttribute('x', r.x); t.setAttribute('y', r.y);
    t.textContent = name;
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', r.x); c.setAttribute('cy', r.y);
    c.setAttribute('r', r.r || (60 + r.count * 9));
    c.setAttribute('fill', 'rgba(201,151,58,.05)');
    c.setAttribute('stroke', 'rgba(201,151,58,.18)');
    layers.realms.append(c, t);
  });

  // faction plates (mid zoom)
  DATA.groups.forEach(g => {
    if (g.x == null || g.members.length < 2) return;
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', g.x); c.setAttribute('cy', g.y);
    c.setAttribute('r', 26 + g.members.length * 7);
    c.setAttribute('fill', 'rgba(232,223,200,.045)');
    c.setAttribute('stroke', 'var(--hair2)');
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'glabel');
    t.setAttribute('x', g.x); t.setAttribute('y', g.y + 4);
    t.textContent = g.label;
    layers.groups.append(c, t);
  });

  // edges — a two-stop gradient, one colour per end, so an asymmetric
  // relationship reads as asymmetric without opening anything
  const defs = document.createElementNS(NS, 'defs');
  svg.insertBefore(defs, gRoot);
  DATA.edges.forEach((e, i) => {
    const A = byId[e.a], B = byId[e.b];
    const gid = 'g' + i;
    const lg = document.createElementNS(NS, 'linearGradient');
    lg.setAttribute('id', gid);
    lg.setAttribute('gradientUnits', 'userSpaceOnUse');
    lg.setAttribute('x1', A.x); lg.setAttribute('y1', A.y);
    lg.setAttribute('x2', B.x); lg.setAttribute('y2', B.y);
    const s1 = document.createElementNS(NS, 'stop');
    const s2 = document.createElementNS(NS, 'stop');
    s1.setAttribute('offset', '5%'); s2.setAttribute('offset', '95%');
    lg.append(s1, s2); defs.appendChild(lg);

    const ln = document.createElementNS(NS, 'line');
    ln.setAttribute('class', 'edge');
    ln.setAttribute('x1', A.x); ln.setAttribute('y1', A.y);
    ln.setAttribute('x2', B.x); ln.setAttribute('y2', B.y);
    layers.edges.appendChild(ln);

    const hit = document.createElementNS(NS, 'line');
    hit.setAttribute('class', 'edge-hit');
    hit.setAttribute('x1', A.x); hit.setAttribute('y1', A.y);
    hit.setAttribute('x2', B.x); hit.setAttribute('y2', B.y);
    hit.addEventListener('pointerenter', () => showEdgeLabel(i, true));
    hit.addEventListener('pointerleave', () => showEdgeLabel(i, false));
    layers.hits.appendChild(hit);

    const lb = document.createElementNS(NS, 'text');
    lb.setAttribute('class', 'elabel');
    lb.setAttribute('text-anchor', 'middle');
    lb.setAttribute('x', (A.x + B.x) / 2); lb.setAttribute('y', (A.y + B.y) / 2 - 5);
    lb.style.display = 'none';
    layers.elabels.appendChild(lb);

    els.edges.push({ line: ln, hit, label: lb, stops: [s1, s2] });
  });

  // nodes
  DATA.nodes.forEach(n => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'node');
    g.setAttribute('transform', `translate(${n.x},${n.y})`);
    const r = 6 + Math.min(9, Math.sqrt(n.degree) * 3);

    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('class', 'core');
    c.dataset.r = r;
    c.setAttribute('r', r);
    c.setAttribute('fill', n.dead ? 'none' : realmColour(n.realm));
    c.setAttribute('stroke', n.dead ? realmColour(n.realm) : 'rgba(20,17,13,.85)');
    if (n.dead) c.setAttribute('stroke-dasharray', '3 2');
    g.appendChild(c);

    // A character carrying hidden readings gets a dotted gold ring. It is the
    // one thing a GM wants to spot at a glance and it costs no colour, which
    // is already spent on realm.
    if (n.secrets){
      const s = document.createElementNS(NS, 'circle');
      s.setAttribute('class', 'secret-ring');
      s.setAttribute('r', r + 3.5);
      g.appendChild(s);
    }
    if (n.dead){
      const d = document.createElementNS(NS, 'text');
      d.setAttribute('class', 'nsub'); d.setAttribute('text-anchor', 'middle');
      d.setAttribute('y', -r - 5); d.textContent = '†';
      g.appendChild(d);
    }

    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'nlabel'); t.setAttribute('text-anchor', 'middle');
    t.setAttribute('y', r + 13); t.textContent = n.name;
    g.appendChild(t);

    if (n.factionLabel){
      const f = document.createElementNS(NS, 'text');
      f.setAttribute('class', 'nsub'); f.setAttribute('text-anchor', 'middle');
      f.setAttribute('y', r + 24); f.textContent = n.factionLabel;
      g.appendChild(f);
    }

    g.addEventListener('click', ev => { ev.stopPropagation(); select(n.id); });
    g.addEventListener('pointerenter', ev => lore(n, ev));
    g.addEventListener('pointerleave', () => $('#lore').classList.remove('on'));
    layers.nodes.appendChild(g);
    els.nodes[n.id] = g;
  });
}

const REALM_COLOUR = { Arvela:'#6B8CA3', Kurogane:'#A3585A', Yongxi:'#5E8A76',
  Starbreeze:'#B0954F', Selmaren:'#8878AE', Nadir:'#7E7A70',
  'The Vampire Homeland':'#9A5C86' };
const realmColour = r => REALM_COLOUR[r] || '#6E6A5E';

/* ── refresh ────────────────────────────────────────────────── */
function refreshEdges(){
  const hop = hopSet();
  const L = lod();
  DATA.edges.forEach((e, i) => {
    const el = els.edges[i];
    const vis = edgeVisible(e);
    const inHop = !hop || (hop.has(e.a) && hop.has(e.b));
    const touching = S.sel && (e.a === S.sel || e.b === S.sel);
    const show = vis && inHop && (!S.hops || inHop);
    el.line.classList.toggle('hidden', !show);
    el.hit.classList.toggle('hidden', !show);
    if (!show) { el.label.style.display = 'none'; return; }

    el.stops[0].setAttribute('stop-color', edgeColour(e, e.aToB));
    el.stops[1].setAttribute('stop-color', edgeColour(e, e.bToA));
    el.line.setAttribute('stroke', `url(#g${i})`);
    /* Thickness is degree of declaration, not an invented intensity number.
       The wiki has no affection scale; the old map's `value` was 0 on 67 of
       142 edges and the bar was showing a fake precision. */
    const both = e.aToB && e.bToA;
    el.line.setAttribute('stroke-width', (both ? 2.6 : 1.5) / Math.max(.5, Math.sqrt(T.k)));
    el.line.setAttribute('stroke-dasharray', both ? '' : '5 4');
    el.line.style.opacity = S.sel ? (touching ? .95 : .07) : .55;
    el.label.style.display = (touching && L === 'node') ? '' : 'none';
    if (touching) el.label.textContent = edgeLabel(e, S.sel);
  });
}
function refreshNodes(){
  const hop = hopSet();
  const conn = new Set();
  if (S.sel){ conn.add(S.sel); adj[S.sel].forEach(e => { if (edgeVisible(e)) conn.add(other(e, S.sel)); }); }
  DATA.nodes.forEach(n => {
    const g = els.nodes[n.id];
    const vis = nodeVisible(n, hop);
    g.classList.toggle('hidden', !vis);
    g.classList.toggle('faded', vis && S.sel && !conn.has(n.id));
  });
}
function refreshCounts(){
  const hop = hopSet();
  const nv = visibleNodes().length;
  const ev = DATA.edges.filter(e =>
    edgeVisible(e) && (!hop || (hop.has(e.a) && hop.has(e.b)))).length;
  const sec = DATA.edges.filter(e => e.hasSecret && e.reveal <= S.reveal).length;
  $('#counts').textContent =
    `${nv} personajes · ${ev} relaciones${S.reveal >= 3 && sec ? ` · ${sec} con lectura oculta` : ''}`;
}
function refresh(){ refreshNodes(); refreshEdges(); refreshCounts(); renderSide(); syncControls(); saveURL(); }

/* ── labels ─────────────────────────────────────────────────── */
function edgeLabel(e, viewer){
  if (S.axis === 'bond'){
    if (!e.bond) return '';
    const fwd = e.a === viewer ? e.bond : (BOND_INVERSE[e.bond] || e.bond);
    return BOND_ES[fwd] || fwd;
  }
  const d = from(e, viewer);
  if (!d) return 'sin declarar';
  return d.label || KIND_ES[d.kind] || d.kind;
}
function showEdgeLabel(i, on){
  const e = DATA.edges[i];
  const el = els.edges[i];
  if (S.sel && (e.a === S.sel || e.b === S.sel)) return;   // already labelled
  if (!on){ el.label.style.display = 'none'; return; }
  const A = byId[e.a].name.split(' ')[0], B = byId[e.b].name.split(' ')[0];
  const ab = edgeLabel(e, e.a), ba = edgeLabel(e, e.b);
  el.label.textContent = ab === ba ? ab : `${A}→${B}: ${ab} · ${B}→${A}: ${ba}`;
  el.label.style.display = '';
}

/* ── hover card ─────────────────────────────────────────────── */
function lore(n, ev){
  const box = $('#lore');
  const bits = [n.factionLabel, n.realm, n.people].filter(Boolean).join(' · ');
  box.innerHTML =
    `<h4></h4><div class="m"></div><p></p>` +
    (n.secrets && S.reveal < 3
      ? `<span class="tag">${n.secrets} lectura${n.secrets>1?'s':''} oculta${n.secrets>1?'s':''}</span>` : '');
  box.querySelector('h4').textContent = n.name;
  box.querySelector('.m').textContent = bits;
  box.querySelector('p').textContent = (n.brief || '').slice(0, 260) +
    ((n.brief || '').length > 260 ? '…' : '');
  const r = $('#stage').getBoundingClientRect();
  const x = ev.clientX - r.left, y = ev.clientY - r.top;
  box.style.left = Math.min(x + 16, r.width - 325) + 'px';
  box.style.top  = Math.min(y + 14, r.height - 190) + 'px';
  box.classList.add('on');
}

/* ── sidebar ────────────────────────────────────────────────── */
function renderSide(){
  const side = $('#side');
  if (!S.sel){ side.innerHTML = legendHTML(); return; }
  const n = byId[S.sel];
  const rels = adj[S.sel]
    .filter(edgeVisible)
    .map(e => ({ e, o: byId[other(e, S.sel)],
                 mine: from(e, S.sel), theirs: from(e, other(e, S.sel)) }))
    .sort((x, y) => x.o.name.localeCompare(y.o.name));

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const readingHTML = (d, who) => {
    if (!d) return `<div class="dir"><span class="arrow">${who}</span>
      <span class="undeclared">sin declarar</span></div>`;
    const col = FACET_COLOUR[KIND_TO_FACET[d.kind] || 'unknown'];
    let h = `<div class="dir"><span class="arrow">${who}</span>
      <span class="swatch" style="background:${col}"></span>
      <span><span class="kind">${esc(d.label || KIND_ES[d.kind] || d.kind)}</span>`;
    if (d.note && d.note !== d.label) h += `<div class="note">${esc(d.note)}</div>`;
    h += `</span></div>`;
    if (d.secret){
      h += secretVisible(d)
        ? `<div class="secret"><div class="who">Lo sabe: ${esc(d.secret.knowers)}</div>
             <p>${esc(d.secret.note)}</p></div>`
        : S.persp
          ? `<div class="locked">🔒 ${esc(byId[S.persp].name)} no lo sabe</div>`
          : `<div class="locked">🔒 hay una lectura oculta · sube la revelación</div>`;
    }
    return h;
  };

  side.innerHTML = `
    <button class="back" onclick="select(null)">← volver</button>
    <div class="dname">${esc(n.name)}</div>
    <div class="dmeta">${[n.factionLabel, n.realm, n.people].filter(Boolean).map(esc).join(' · ')}
      ${n.dead ? ' · † fallecido' : ''}</div>
    ${n.brief ? `<div class="dbrief">${esc(n.brief)}</div>` : ''}
    <div class="sh">${rels.length} relaci${rels.length === 1 ? 'ón' : 'ones'}</div>
    ${rels.map(r => `
      <div class="rel" data-go="${esc(r.o.id)}">
        <div class="rn">${esc(r.o.name)}
          ${r.e.bond ? `<span class="nsub" style="font:9px var(--mono);color:var(--faint)">
            ${esc(BOND_ES[r.e.bond] || r.e.bond)}</span>` : ''}</div>
        ${readingHTML(r.mine, '→')}
        ${readingHTML(r.theirs, '←')}
      </div>`).join('')}`;
  side.querySelectorAll('[data-go]').forEach(el =>
    el.addEventListener('click', () => select(el.dataset.go)));
}

function legendHTML(){
  const facets = Object.entries(FACET_LABEL)
    .map(([k, l]) => `<div class="legend-row">
      <span class="legend-line" style="background:${FACET_COLOUR[k]}"></span>${l}</div>`).join('');
  const bonds = Object.entries(BOND_FAMILY_ES)
    .map(([k, l]) => `<div class="legend-row">
      <span class="legend-line" style="background:${BOND_COLOUR[k]}"></span>${l}</div>`).join('');
  return `<div class="empty">
      Haz clic en un <strong>personaje</strong> para abrir su ficha.<br>
      Rueda para acercar: lejos ves <strong>reinos</strong>, luego <strong>facciones</strong>,
      luego <strong>personas</strong>.<br>
      El anillo dorado punteado marca a quien guarda <strong>lecturas ocultas</strong>.<br>
      <kbd>Esc</kbd> deselecciona · <kbd>/</kbd> busca
    </div>
    <div class="sh">${S.axis === 'bond' ? 'Estructura del vínculo' : 'Sentimiento'}</div>
    ${S.axis === 'bond' ? bonds : facets}
    <div class="legend-row" style="margin-top:6px">
      <span class="legend-line" style="background:var(--dim);height:2px"></span>
      línea discontinua = declarada por un solo lado</div>
    <div class="sh">Reinos</div>
    ${Object.entries(REALM_COLOUR).filter(([r]) => DATA.realms[r]).map(([r, c]) =>
      `<div class="legend-row"><span class="legend-line"
        style="background:${c};height:9px;width:9px;border-radius:50%"></span>${r}
        <span style="color:var(--faint)">${DATA.realms[r].count}</span></div>`).join('')}`;
}

/* ── interactions ───────────────────────────────────────────── */
function select(id, zoom = true){
  S.sel = (id === S.sel) ? null : id;
  refresh();
  if (S.sel && zoom){
    const ids = [S.sel, ...adj[S.sel].filter(edgeVisible).map(e => other(e, S.sel))];
    fit(S.hops ? ids : null, 380);
    if (!S.hops) { /* keep the whole map framed; the selection is highlighted */ }
  }
}
window.select = select;

function syncControls(){
  document.querySelectorAll('#hops button').forEach(b =>
    b.setAttribute('aria-pressed', String(+b.dataset.h === S.hops)));
  document.querySelectorAll('#axis button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.a === S.axis)));
  $('#reveal').value = S.reveal;
  $('#reveal-val').textContent = (DATA.reveals.find(r => r.level === S.reveal) || {}).label || '';
  $('#perspective').setAttribute('aria-pressed', String(!!S.persp));
  setPerspLabel();
  document.querySelectorAll('#realms .chip').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.v === (S.realm || ''))));
  document.querySelectorAll('#peoples .chip').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.v === (S.people || ''))));
}

function chipRow(host, values, colourOf, onPick, current){
  host.innerHTML = '';
  const mk = (label, value, n, colour) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.v = value;
    b.innerHTML = `${label}${n != null ? `<span class="n">${n}</span>` : ''}`;
    if (value === (current() || '')) { b.style.background = colour; b.style.color = '#14110D'; }
    b.onclick = () => { onPick(current() === value ? null : (value || null)); };
    host.appendChild(b);
  };
  mk('Todos', '', null, 'var(--ember)');
  values.forEach(([v, n]) => mk(v, v, n, colourOf(v)));
}
function buildChips(){
  const rc = {}, pc = {};
  DATA.nodes.forEach(n => {
    if (n.realm) rc[n.realm] = (rc[n.realm] || 0) + 1;
    if (n.people) pc[n.people] = (pc[n.people] || 0) + 1;
  });
  const sorted = o => Object.entries(o).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  chipRow($('#realms'), sorted(rc), realmColour,
    v => { S.realm = v; refresh(); buildChips(); }, () => S.realm);
  chipRow($('#peoples'), sorted(pc), () => '#8F7AB0',
    v => { S.people = v; refresh(); buildChips(); }, () => S.people);
}

/* search */
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
let hitIdx = -1, hitList = [];
function runSearch(){
  const box = $('#hits'), term = norm($('#q').value).trim();
  if (term.length < 2){ box.classList.remove('open'); box.innerHTML = ''; hitList = []; return; }
  hitList = DATA.nodes.filter(n =>
    [n.name, ...(n.aliases || []), n.factionLabel, n.realm, n.people]
      .some(f => norm(f).includes(term))).slice(0, 10);
  box.innerHTML = hitList.length ? '' : '<button disabled><small>sin resultados</small></button>';
  hitList.forEach((n, i) => {
    const b = document.createElement('button');
    b.innerHTML = `${n.name}<small>${[n.factionLabel, n.realm].filter(Boolean).join(' · ') || 'sin afiliación'}</small>`;
    b.onclick = () => pick(i);
    box.appendChild(b);
  });
  hitIdx = -1; box.classList.add('open');
}
function pick(i){
  const n = hitList[i]; if (!n) return;
  $('#hits').classList.remove('open'); $('#q').value = n.name; $('#q').blur();
  /* Selecting from search MOVES the view. The old map opened the sheet for a
     character who might be entirely off screen, which reads as nothing
     happening. */
  S.sel = n.id; refresh();
  animateTo(viewport().w/2 - n.x * Math.max(T.k, .85),
            viewport().h/2 - n.y * Math.max(T.k, .85), Math.max(T.k, .85), 420);
}
$('#q').addEventListener('input', runSearch);
$('#q').addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){ $('#q').value = ''; runSearch(); $('#q').blur(); }
  if (!hitList.length) return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
    ev.preventDefault();
    hitIdx = (hitIdx + (ev.key === 'ArrowDown' ? 1 : -1) + hitList.length) % hitList.length;
    [...$('#hits').children].forEach((c, i) => c.classList.toggle('cur', i === hitIdx));
  }
  if (ev.key === 'Enter' && hitIdx >= 0) pick(hitIdx);
});
document.addEventListener('click', ev => {
  if (!ev.target.closest('.search')) $('#hits').classList.remove('open');
});

/* perspective — the feature the `Known to:` discipline earns. Filters the map
   to what one character could actually know about, using the knower lists the
   wiki already maintains on every secret. */
function togglePerspective(){
  if (S.persp){ S.persp = null; setPerspLabel(); refresh(); fit(null, 380); return; }
  if (!S.sel){
    $('#perspective').textContent = 'elige un personaje primero';
    setTimeout(setPerspLabel, 1600);
    return;
  }
  S.persp = S.sel; setPerspLabel(); refresh(); fit(null, 380);
}
function setPerspLabel(){
  $('#perspective').textContent =
    S.persp ? `Perspectiva: ${byId[S.persp].name}` : 'Perspectiva';
}
$('#perspective').onclick = togglePerspective;

/* controls */
document.querySelectorAll('#hops button').forEach(b =>
  b.onclick = () => { S.hops = +b.dataset.h; refresh(); if (S.sel && S.hops) select(S.sel, true); });
document.querySelectorAll('#axis button').forEach(b =>
  b.onclick = () => { S.axis = b.dataset.a; refresh(); });
$('#reveal').oninput = e => { S.reveal = +e.target.value; refresh(); };
$('#fit').onclick = () => fit(null, 420);
$('#reset').onclick = () => {
  /* Reset means reset. The old one restored filters and pins but left five
     sliders wherever the session had dragged them, so the map you got back
     was not the map you opened. */
  S = { ...DEF };
  $('#q').value = ''; runSearch();
  buildChips(); refresh(); fit(null, 420);
};
$('#bar-toggle').onclick = () => {
  const open = $('#bar').classList.toggle('open');
  $('#bar-toggle').setAttribute('aria-expanded', String(open));
  $('#bar-toggle').textContent = 'Filtros y controles ' + (open ? '▴' : '▾');
};
$('#toggle-side').onclick = () => {
  S.side = !S.side;
  $('#side').classList.toggle('off', !S.side);
  $('#toggle-side').textContent = S.side ? '›' : '‹';
  requestAnimationFrame(() => fit(null, 260));
};
document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  if (ev.key === 'Escape') select(null);
  if (ev.key === '/'){ ev.preventDefault(); $('#q').focus(); }
  if (ev.key >= '0' && ev.key <= '3'){ S.hops = +ev.key; refresh(); }
});

/* URL state, so a view can be shared or bookmarked */
function saveURL(){
  const p = new URLSearchParams();
  if (S.sel) p.set('n', S.sel);
  if (S.hops) p.set('h', S.hops);
  if (S.reveal !== 1) p.set('r', S.reveal);
  if (S.axis !== 'kind') p.set('a', S.axis);
  if (S.realm) p.set('realm', S.realm);
  if (S.people) p.set('people', S.people);
  if (S.persp) p.set('p', S.persp);
  history.replaceState(null, '', p.toString() ? '?' + p : location.pathname);
}
function loadURL(){
  const p = new URLSearchParams(location.search);
  if (p.get('n') && byId[p.get('n')]) S.sel = p.get('n');
  if (p.get('h')) S.hops = Math.min(3, Math.max(0, +p.get('h') || 0));
  if (p.get('r')) S.reveal = Math.min(3, Math.max(1, +p.get('r') || 1));
  if (p.get('a') === 'bond') S.axis = 'bond';
  if (p.get('realm')) S.realm = p.get('realm');
  if (p.get('people')) S.people = p.get('people');
  if (p.get('p') && byId[p.get('p')]) S.persp = p.get('p');
}

window.addEventListener('resize', () => { lastLOD = null; updateLOD(); });

/* ── init ───────────────────────────────────────────────────── */
build();
loadURL();
buildChips();
refresh();
fit(null, 0);
</script>
